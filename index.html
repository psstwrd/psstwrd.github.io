<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsstWrd - Memorable Password Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PsstWrd 🔐</h1>
        <div class="controls">
            <div class="form-group">
                <label>Length: </label>
                <input type="number" id="minLength" value="12" min="8" max="30">
                <span>-</span>
                <input type="number" id="maxLength" value="16" min="8" max="30">
            </div>
            <div class="form-group">
                <label>End Digits: </label>
                <input type="number" id="digitsAtEnd" value="0" min="0" max="6">
            </div>
            <div class="form-group">
                <label class="checkbox">
                    <input type="checkbox" id="forceDigitsEnd">
                    <span>Force digits at end only</span>
                </label>
            </div>
            <button id="generateBtn">Generate Password</button>
        </div>
        <div class="result">
            <input type="text" id="password" readonly>
            <button id="copyBtn">📋</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
